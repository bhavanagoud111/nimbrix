[project]
name = "nimbrix-api"
version = "0.1.0"
description = "Nimbrix API: cloud cost intelligence and optimization backend (modular monolith)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
    "boto3>=1.43.111",
    "python-multipart>=0.0.32",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "statsmodels>=0.15.0",
    "langgraph>=1.2.14",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx2>=0.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "boto3-stubs[athena,ce,cloudwatch,ec2,sts]>=1.43.111",
    "pandas-stubs>=3.0.5.260914",
]

[project.scripts]
nimbrix-export-openapi = "nimbrix_api.openapi_export:main"
nimbrix-seed = "nimbrix_api.seed:main"
nimbrix-worker = "nimbrix_api.worker:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nimbrix_api"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "N", "PT", "TID", "ASYNC", "PL",
]
ignore = [
    "PLR0913", # FastAPI dependencies make long signatures normal
    "PLR2004", # magic values are fine in tests and HTTP status checks
    "PLR0917", # FastAPI endpoints take many injected positional parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"src/nimbrix_api/migrations/**" = ["N999", "E501", "PLR0915"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["nimbrix_api"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a reachable PostgreSQL (NIMBRIX_TEST_DATABASE_URL)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["nimbrix_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
