# Local Nimbrix stack. No cloud credentials, no LLM keys, no paid services.
# Host ports bind to 127.0.0.1 only; override them in .env (see .env.example).

name: nimbrix

x-api-environment: &api-environment
  NIMBRIX_ENVIRONMENT: ${NIMBRIX_ENVIRONMENT:-local}
  NIMBRIX_LOG_LEVEL: ${NIMBRIX_LOG_LEVEL:-INFO}
  NIMBRIX_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nimbrix}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-nimbrix}
  NIMBRIX_LIVE_ACTIONS_ENABLED: "false"
  NIMBRIX_DEMO_SEED: ${NIMBRIX_DEMO_SEED:-false}
  NIMBRIX_DEMO_PASSWORD: ${NIMBRIX_DEMO_PASSWORD:-}
  NIMBRIX_LLM_PROVIDER: ${NIMBRIX_LLM_PROVIDER:-none}
  NIMBRIX_LLM_MODEL: ${NIMBRIX_LLM_MODEL:-}
  NIMBRIX_LLM_API_KEY: ${NIMBRIX_LLM_API_KEY:-}
  NIMBRIX_LLM_BASE_URL: ${NIMBRIX_LLM_BASE_URL:-}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nimbrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nimbrix}
    ports:
      - "127.0.0.1:${NIMBRIX_POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    image: nimbrix-api:local
    # Migrate, then seed demo tenants/data only when NIMBRIX_DEMO_SEED=true (opt-in).
    command: ["sh", "-c", "alembic -c /app/alembic.ini upgrade head && nimbrix-seed --if-enabled"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: nimbrix-api:local
    environment:
      <<: *api-environment
      # Only the web container and loopback can reach the API, so forwarded client IPs are
      # trusted here. In production, set this to the load balancer / web tier addresses.
      FORWARDED_ALLOW_IPS: "*"
      NIMBRIX_RATE_LIMIT_REQUESTS_PER_MINUTE: ${NIMBRIX_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      NIMBRIX_OTEL_ENABLED: ${NIMBRIX_OTEL_ENABLED:-false}
      NIMBRIX_OTEL_EXPORTER_OTLP_ENDPOINT: ${NIMBRIX_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${NIMBRIX_API_PORT:-8200}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: nimbrix-api:local
    command: ["nimbrix-worker"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    image: nimbrix-web:local
    environment:
      # Server-side only: the browser talks to the web origin, which proxies /api/v1.
      NIMBRIX_API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${NIMBRIX_WEB_PORT:-3200}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # --- Optional local observability: `docker compose --profile observability up -d` ---
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${NIMBRIX_PROMETHEUS_PORT:-9290}:9090"
    depends_on: [api, worker]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${NIMBRIX_GRAFANA_PORT:-3290}:3000"
    depends_on: [prometheus]

volumes:
  postgres-data:
