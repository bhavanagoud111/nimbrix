# Local scrape config. Both targets are on the internal compose network only.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: nimbrix-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: nimbrix-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
