name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.4"
  NODE_VERSION: "24"

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: nimbrix
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nimbrix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nimbrix -d nimbrix"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      NIMBRIX_TEST_DATABASE_URL: postgresql+psycopg://nimbrix:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check . --output-format=github
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy src tests
      - name: pytest (unit + integration against PostgreSQL 16)
        run: uv run pytest --cov --cov-report=term
      - name: Migrations apply from an empty database
        env:
          NIMBRIX_DATABASE_URL: postgresql+psycopg://nimbrix:ci-only-password@127.0.0.1:5432/nimbrix
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check -w @nimbrix/web
      - name: TypeScript
        run: |
          npm run typecheck
          npx tsc -p tsconfig.json
      - name: Vitest
        run: npm test
      - name: Next.js production build
        run: npm run build

  contracts:
    name: API contracts are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cd apps/api && uv sync --frozen
      - name: Regenerate OpenAPI and TypeScript types
        run: make contracts
      - name: Fail on drift
        run: git diff --exit-code -- packages/contracts

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan of the full git history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --config /repo/.gitleaks.toml --redact
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Python runtime dependencies (pip-audit)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Node production dependencies (npm audit)
        run: npm audit --omit=dev --audit-level=high

  terraform:
    name: Terraform fmt and validate (no plan, no apply)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/terraform/aws
    steps:
      - uses: actions/checkout@v7
      - name: fmt
        run: docker run --rm -v "$PWD:/tf" -w /tf hashicorp/terraform:1.16.5 fmt -check -recursive
      - name: validate
        run: |
          docker run --rm -v "$PWD:/tf" -w /tf hashicorp/terraform:1.16.5 init -backend=false -input=false
          docker run --rm -v "$PWD:/tf" -w /tf hashicorp/terraform:1.16.5 validate

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  stack-e2e:
    name: Docker Compose stack + Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, web]
    env:
      POSTGRES_PASSWORD: ci-only-password
      NIMBRIX_DEMO_SEED: "true"
      NIMBRIX_DEMO_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build and start the stack (with opt-in demo seed)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Wait for demo import and analysis
        run: scripts/wait-for-demo.sh http://127.0.0.1:3200 240
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
      - name: Observability profile starts and scrapes both targets
        run: |
          docker compose --profile observability up -d --wait prometheus grafana
          for _ in $(seq 1 20); do
            up=$(curl -fsS http://127.0.0.1:9290/api/v1/targets | python3 -c 'import sys,json; print(sum(t["health"]=="up" for t in json.load(sys.stdin)["data"]["activeTargets"]))')
            [ "$up" = "2" ] && exit 0
            sleep 3
          done
          echo "Prometheus targets not up" && exit 1
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v
