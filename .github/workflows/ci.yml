name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.4"
  NODE_VERSION: "24"

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: nimbrix
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nimbrix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nimbrix -d nimbrix"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      NIMBRIX_TEST_DATABASE_URL: postgresql+psycopg://nimbrix:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check . --output-format=github
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy src tests
      - name: pytest (unit + integration against PostgreSQL 16)
        run: uv run pytest --cov --cov-report=term
      - name: Migrations apply from an empty database
        env:
          NIMBRIX_DATABASE_URL: postgresql+psycopg://nimbrix:ci-only-password@127.0.0.1:5432/nimbrix
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check -w @nimbrix/web
      - name: TypeScript
        run: |
          npm run typecheck
          npx tsc -p tsconfig.json
      - name: Vitest
        run: npm test
      - name: Next.js production build
        run: npm run build

  contracts:
    name: API contracts are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cd apps/api && uv sync --frozen
      - name: Regenerate OpenAPI and TypeScript types
        run: make contracts
      - name: Fail on drift
        run: git diff --exit-code -- packages/contracts

  stack-e2e:
    name: Docker Compose stack + Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, web]
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v
